# Publishes the package to npm when a version tag is pushed:
#   npm version patch -w @johannes-fraundorfer/astro-cms
#   git push; git tag v0.5.1; git push origin v0.5.1
#
# Uses npm trusted publishing: npm accepts this workflow's short-lived GitHub
# identity instead of a stored token, and signs the release with provenance.
# The trusted publisher (this repo + release.yml) is set on the package's
# settings page on npmjs.com.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5+, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/astro-cms/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package version $version" >&2
            exit 1
          fi

      - name: Type check against the playground
        run: npm run check

      - run: npm publish -w @johannes-fraundorfer/astro-cms
